      - name: Commit and push `mihomo-ruleset` branch
        run: |
          cd ./mihomo-ruleset/ || exit 1

          git init

          git config --local \
            user.email "github-actions[bot]@users.noreply.github.com"

          git config --local \
            user.name "github-actions[bot]"

          git checkout -b mihomo-ruleset

          git add .

          git commit \
            -m "mihomo 内核 rule-set 规则集文件更新于 ${update_version}"

          git remote add origin \
            "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

          git push -f origin mihomo-ruleset


      # ============================================================
      # Release sing-box-ruleset-compatible
      # ============================================================

      - name: Release and upload `sing-box-ruleset-compatible` assets
        uses: svenstaro/upload-release-action@v2
        with:
