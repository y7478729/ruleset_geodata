          done


          # ----------------------------------------------------------
          # mihomo-ruleset
          # ----------------------------------------------------------

          cd ../mihomo-ruleset/ || exit 1

          for file in *; do
            [ -f "$file" ] || continue

            curl -i \
              "https://purge.jsdelivr.net/gh/${{ github.repository }}@mihomo-ruleset/${file}"
