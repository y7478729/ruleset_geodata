    # ==========================================================
    # Purge jsDelivr
    # ==========================================================

    - name: Purge jsDelivr CDN
      shell: bash
      run: |
        set -euo pipefail

        purge_branch() {
          local directory="$1"
          local branch="$2"

          if [ ! -d "${directory}" ]; then
            return 0
          fi

          cd "${directory}"

          shopt -s nullglob

          for file in *; do
            [ -f "${file}" ] || continue

            echo "Purging jsDelivr:"
            echo "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${branch}/${file}"

            curl -fsSL \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${branch}/${file}"
          done

          cd - >/dev/null
        }

        # --------------------------------------------------------
        # mihomo-geodata
        # --------------------------------------------------------

        purge_branch \
          "./mihomo-geodata" \
          "mihomo-geodata"

        # --------------------------------------------------------
        # mihomo-ruleset
        # --------------------------------------------------------

        purge_branch \
          "./mihomo-ruleset" \
          "mihomo-ruleset"

        # --------------------------------------------------------
        # sing-box-ruleset-compatible
        # --------------------------------------------------------

        purge_branch \
          "./sing-box-ruleset-compatible" \
          "sing-box-ruleset-compatible"

        # --------------------------------------------------------
        # sing-box-ruleset
        # --------------------------------------------------------

        purge_branch \
          "./sing-box-ruleset" \
          "sing-box-ruleset"

        # --------------------------------------------------------
        # loon_ruleset
        # --------------------------------------------------------

        purge_branch \
          "./loon_ruleset" \
          "loon_ruleset"

    # ==========================================================
