          git push -f origin sing-box-ruleset-compatible


      # ============================================================
      # Release sing-box-ruleset
      # ============================================================

      - name: Release and upload `sing-box-ruleset` assets (singbox_equal == true)
        if: ${{ env.singbox_equal == 'true' }}
