name: Build ruleset and geodata

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "**/*.ini"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Set variables
      # ============================================================

      - name: Set variables
        run: |
          echo "update_version=$(date -d '+8 hours' +%Y-%m-%d)" >> ${GITHUB_ENV}

          echo "singbox_core_release_version=$(curl -sSL https://api.github.com/repos/reF1nd/sing-box/tags?per_page=100 | jq -r '.[].name' | grep -P '^v?[0-9]+\.[0-9]+\.[0-9]+-reF1nd.*' | head -n 1 | awk -F'[v.-]' '{print $2"."$3".0"}')" >> ${GITHUB_ENV}

          echo "singbox_core_latest_version=$(curl -sSL https://raw.githubusercontent.com/reF1nd/sing-box/reF1nd-testing/docs/configuration/rule-set/source-format.md | awk '/\*/ {last=$0} END {print last}' | sed -n 's/.*\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p')" >> ${GITHUB_ENV}

          echo "singbox_core_compatible_version=$(curl -sSL https://raw.githubusercontent.com/reF1nd/sing-box/reF1nd-testing/docs/configuration/rule-set/source-format.md | awk '/\*/{lines[++count]=$0} END{print lines[count-1]}' | sed -n 's/.*\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p')" >> ${GITHUB_ENV}

          echo "singbox_rules_latest_version=$(curl -sSL https://raw.githubusercontent.com/reF1nd/sing-box/reF1nd-testing/docs/configuration/rule-set/source-format.md | awk '/\*/ {last=$0} END {print last}' | sed -n 's/^* \([0-9]\+\):.*/\1/p')" >> ${GITHUB_ENV}

          echo "singbox_rules_compatible_version=$(curl -sSL https://raw.githubusercontent.com/reF1nd/sing-box/reF1nd-testing/docs/configuration/rule-set/source-format.md | awk '/\*/{lines[++count]=$0} END{print lines[count-1]}' | sed -n 's/^* \([0-9]\+\):.*/\1/p')" >> ${GITHUB_ENV}

          echo "domains_download_url=https://github.com/a7478729/domain-list-custom/releases/download/domains" >> ${GITHUB_ENV}

          echo "ips_download_url=https://github.com/a7478729/geoip/releases/download/ips" >> ${GITHUB_ENV}

        shell: bash


      # ============================================================
      # Clone Repository
      # ============================================================

      - name: Clone Repository
        uses: actions/checkout@v7


      # ============================================================
      # Checkout domain-list-custom
      # ============================================================

      - name: Checkout `a7478729/domain-list-custom`
        uses: actions/checkout@v7
        with:
          repository: a7478729/domain-list-custom
          path: custom


      # ============================================================
      # Checkout domain-list-community
      # ============================================================

      - name: Checkout `v2fly/domain-list-community`
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          path: community


      # ============================================================
      # Setup Go
      # ============================================================

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./custom/go.mod
          cache-dependency-path: ./custom/go.sum


      # ============================================================
      # Generate mihomo geodata
      # ============================================================

      - name: Generate `mihomo` geodata
        run: |
          mkdir -p ./tmp/ ./community/mydata/

          archs1=(
            ads
            private
            trackerslist
            microsoft-cn
            apple-cn
            google-cn
            games-cn
            games
            netflix
            disney
            max
            primevideo
            appletv
            youtube
            tiktok
            bilibili
            spotify
            media
            ai
            networktest
            tld-proxy
            gfw
            proxy
            cn
          )

          archs2=(
            ads
            private
            microsoft-cn
            apple-cn
            google-cn
            games-cn
            games
            ai
            networktest
            tld-proxy
            gfw
            proxy
            cn
          )

          archs3=(
            private
            microsoft-cn
            apple-cn
            google-cn
            games-cn
            gfw
            cn-lite
          )


          # ----------------------------------------------------------
          # fakeip-filter
          # ----------------------------------------------------------

          curl -sSL "${domains_download_url}/fakeip-filter.list" \
            | awk '!/(DOMAIN-REGEX,|ntp|stun|time)/' \
            | sed \
              -e 's/DOMAIN,/full:/' \
              -e 's/DOMAIN-SUFFIX,//' \
            > ./tmp/temp-fakeip-filter.txt

          cat <<EOF >> ./tmp/temp-fakeip-filter.txt
          keyword:ntp
          keyword:stun
          keyword:time
          EOF

          curl -sSL "${domains_download_url}/fakeip-filter.list" \
            | awk '/DOMAIN-REGEX,/ && !/(ntp|stun|time)/' \
            | sed 's/DOMAIN-REGEX,/regexp:/' \
            >> ./tmp/temp-fakeip-filter.txt

          sort --ignore-case \
            ./tmp/temp-fakeip-filter.txt \
            > ./tmp/fakeip-filter.txt


          # ----------------------------------------------------------
          # fakeip-filter-lite
          # ----------------------------------------------------------

          curl -sSL "${domains_download_url}/fakeip-filter-lite.list" \
            | awk '!/(DOMAIN-REGEX,|ntp|stun|time)/' \
            | sed \
              -e 's/DOMAIN,/full:/' \
              -e 's/DOMAIN-SUFFIX,//' \
            > ./tmp/temp-fakeip-filter-lite.txt

          cat <<EOF >> ./tmp/temp-fakeip-filter-lite.txt
          keyword:ntp
          keyword:stun
          keyword:time
          EOF

          sort --ignore-case \
            ./tmp/temp-fakeip-filter-lite.txt \
            > ./tmp/fakeip-filter-lite.txt


          # ----------------------------------------------------------
          # geosite-all.dat
          # ----------------------------------------------------------

          cd ./community/

          for arch1 in "${archs1[@]}"; do
            curl -sSL "${domains_download_url}/${arch1}.list" \
              | sed \
                -e 's/DOMAIN,/full:/' \
                -e 's/DOMAIN-SUFFIX,//' \
                -e 's/DOMAIN-KEYWORD,/keyword:/' \
                -e 's/DOMAIN-REGEX,/regexp:/' \
              > "./mydata/${arch1}"
          done

          cp -f ../tmp/fakeip-filter.txt ./mydata/fakeip-filter

          go run ./ \
            --datapath=./mydata/ \
            --outputname geosite-all.dat


          # ----------------------------------------------------------
          # geosite-all-lite.dat
          # ----------------------------------------------------------

          rm -f ./mydata/ads

          cp -f ../tmp/fakeip-filter-lite.txt \
            ./mydata/fakeip-filter

          go run ./ \
            --datapath=./mydata/ \
            --outputname geosite-all-lite.dat


          # ----------------------------------------------------------
          # geosite.dat
          # ----------------------------------------------------------

          rm -f ./mydata/*

          for arch2 in "${archs2[@]}"; do
            curl -sSL "${domains_download_url}/${arch2}.list" \
              | sed \
                -e 's/DOMAIN,/full:/' \
                -e 's/DOMAIN-SUFFIX,//' \
                -e 's/DOMAIN-KEYWORD,/keyword:/' \
                -e 's/DOMAIN-REGEX,/regexp:/' \
              > "./mydata/${arch2}"
          done

          cp -f ../tmp/fakeip-filter.txt \
            ./mydata/fakeip-filter

          go run ./ \
            --datapath=./mydata/ \
            --outputname geosite.dat


          # ----------------------------------------------------------
          # geosite-lite.dat
          # ----------------------------------------------------------

          rm -f ./mydata/ads

          cp -f ../tmp/fakeip-filter-lite.txt \
            ./mydata/fakeip-filter

          go run ./ \
            --datapath=./mydata/ \
            --outputname geosite-lite.dat


          # ----------------------------------------------------------
          # geosite-mini.dat
          # ----------------------------------------------------------

          rm -f ./mydata/*

          for arch3 in "${archs3[@]}"; do
            curl -sSL "${domains_download_url}/${arch3}.list" \
              | sed \
                -e 's/DOMAIN,/full:/' \
                -e 's/DOMAIN-SUFFIX,//' \
                -e 's/DOMAIN-KEYWORD,/keyword:/' \
                -e 's/DOMAIN-REGEX,/regexp:/' \
              > "./mydata/${arch3}"
          done

          mv -f ./mydata/cn-lite ./mydata/cn

          go run ./ \
            --datapath=./mydata/ \
            --outputname geosite-mini.dat


      # ============================================================
      # Get geoip relative files
      # ============================================================

      - name: Get geoip relative files
        run: |
          mkdir -p ./mihomo-geodata/

          mihomo_mmdb=(
            $(curl -sSL https://api.github.com/repos/a7478729/geoip/releases \
              | awk '/"browser_download_url"/' \
              | awk '/.mmdb/' \
              | awk -F '"' '{print $4}')
          )

          count_mihomo_mmdb=${#mihomo_mmdb[@]}

          for ((i = 0; i < count_mihomo_mmdb; i++)); do
            wget -q \
              -P ./mihomo-geodata/ \
              "${mihomo_mmdb[i]}"
          done


          mihomo_others=(
            $(curl -sSL https://api.github.com/repos/a7478729/geoip/releases \
              | awk '/"browser_download_url"/' \
              | awk '/\/mihomo-geodata\//' \
              | awk '!/\.mmdb/' \
              | awk -F '"' '{print $4}')
          )

          count_mihomo_others=${#mihomo_others[@]}

          for ((i = 0; i < count_mihomo_others; i++)); do
            wget -q \
              -P ./community/ \
              "${mihomo_others[i]}"
          done


      # ============================================================
      # Move mihomo geodata files
      # ============================================================

      - name: Move `mihomo` geodata files
        run: |
          cd ./community/ || exit 1

          for file in $(ls *.dat *.metadb); do
            install -Dp \
              "./${file}" \
              ../mihomo-geodata/
          done

          rm -rf ../custom* ../community*


      # ============================================================
      # Download mihomo rule-set files
      # ============================================================

      - name: Download `mihomo` rule-set files
        run: |
          mkdir -p ./mihomo-ruleset/

          domains=(
            ads
            trackerslist
            microsoft-cn
            apple-cn
            google-cn
            games-cn
            games
            netflix
            disney
            max
            primevideo
            appletv
            youtube
            tiktok
            bilibili
            spotify
            media
            ai
            networktest
            tld-proxy
            gfw
            proxy
            cn
            cn-lite
          )

          ips=(
            privateip
            cnip
            telegramip
            netflixip
            mediaip
          )


          for domain in "${domains[@]}"; do
            mkdir -p "./tools/domains/${domain}/"

            curl -sSL \
              "${domains_download_url}/${domain}.list" \
              | awk '/(DOMAIN,|DOMAIN-SUFFIX,)/' \
              | sed \
                -e 's/DOMAIN,//' \
                -e 's/DOMAIN-SUFFIX,/\+\./' \
              >> "./tools/domains/${domain}/${domain}.list"
          done


          # ----------------------------------------------------------
          # fakeip-filter
          # ----------------------------------------------------------

          mkdir -p ./tools/domains/fakeip-filter/

          curl -sSL "${domains_download_url}/fakeip-filter.list" \
            | awk '!/DOMAIN-REGEX,/' \
            | sed \
              -e 's/DOMAIN,//' \
              -e 's/DOMAIN-SUFFIX,/\+\./' \
            > ./tmp/temp-fakeip-filter-domains.txt

          curl -sSL "${domains_download_url}/fakeip-filter.list" \
            | awk '/DOMAIN-REGEX,/' \
            | sed \
              -e 's/\\s/ /' \
              -e 's/\\./\./g' \
              -e 's/\[\^.\]+/*/g' \
              -e 's/\^\.\*/\^\+/' \
              -e 's/.*\^//; s/\$//' \
            >> ./tmp/temp-fakeip-filter-domains.txt

          sort --ignore-case \
            ./tmp/temp-fakeip-filter-domains.txt \
            >> ./tools/domains/fakeip-filter/fakeip-filter.list


          # ----------------------------------------------------------
          # fakeip-filter-lite
          # ----------------------------------------------------------

          mkdir -p ./tools/domains/fakeip-filter-lite/

          curl -sSL "${domains_download_url}/fakeip-filter-lite.list" \
            | awk '!/DOMAIN-REGEX,/' \
            | sed \
              -e 's/DOMAIN,//' \
              -e 's/DOMAIN-SUFFIX,/\+\./' \
            > ./tmp/temp-fakeip-filter-lite-domains.txt

          curl -sSL "${domains_download_url}/fakeip-filter-lite.list" \
            | awk '/DOMAIN-REGEX,/' \
            | sed \
              -e 's/\\./\./g' \
              -e 's/\[\^.\]+/*/g' \
              -e 's/\^\.\*/\^\+/' \
              -e 's/.*\^//; s/\$//' \
            >> ./tmp/temp-fakeip-filter-lite-domains.txt

          sort --ignore-case \
            ./tmp/temp-fakeip-filter-lite-domains.txt \
            >> ./tools/domains/fakeip-filter-lite/fakeip-filter-lite.list


          # ----------------------------------------------------------
          # private
          # ----------------------------------------------------------

          mkdir -p ./tools/domains/private/

          curl -sSL "${domains_download_url}/private.list" \
            | awk '/(DOMAIN,|DOMAIN-SUFFIX,)/' \
            | sed \
              -e 's/DOMAIN,//' \
              -e 's/DOMAIN-SUFFIX,/\+\./' \
            > ./tmp/temp-private-domains.txt

          curl -sSL "${domains_download_url}/private.list" \
            | awk '/DOMAIN-REGEX,/' \
            | sed \
              -e 's/\\./\./g' \
              -e 's/\[\^.\]+/*/g' \
              -e 's/\^\.\*/\^\+/' \
              -e 's/.*\^//; s/\$//' \
            >> ./tmp/temp-private-domains.txt

          sort --ignore-case \
            ./tmp/temp-private-domains.txt \
            >> ./tools/domains/private/private.list


          rm -f ./tmp/*


          # ----------------------------------------------------------
          # applications
          # ----------------------------------------------------------

          curl -sSL \
            "${domains_download_url}/applications.list" \
            > ./mihomo-ruleset/applications.list


          # ----------------------------------------------------------
          # IP
          # ----------------------------------------------------------

          for ip in "${ips[@]}"; do
            mkdir -p "./tools/ips/${ip}/"

            curl -sSL \
              "${ips_download_url}/${ip}.list" \
              | sed 's/.*,//' \
              >> "./tools/ips/${ip}/${ip}.list"
          done


      # ============================================================
      # Generate mihomo rule-set (mrs) and move .list files
      # ============================================================

      - name: Generate `mihomo` rule-set (mrs) and move .list files
        run: |
          curl -sS \
            -o ./tools/mihomo \
            -L https://github.com/a7478729/proxy-tools/releases/download/mihomo/mihomo-meta-linux-amd64-v3.upx

          chmod +x ./tools/mihomo

          cd ./tools/

          chmod +x ./mihomo


          # ----------------------------------------------------------
          # Domain rules
          # ----------------------------------------------------------

          list=($(ls ./domains/))

          for ((i = 0; i < ${#list[@]}; i++)); do

            ./mihomo convert-ruleset \
              domain \
              text \
              "./domains/${list[i]}/${list[i]}.list" \
              "../mihomo-ruleset/${list[i]}.mrs"

            mv -f \
              "./domains/${list[i]}/${list[i]}.list" \
              ../mihomo-ruleset/

          done


          # ----------------------------------------------------------
          # IP rules
          # ----------------------------------------------------------

          list=($(ls ./ips/))

          for ((i = 0; i < ${#list[@]}; i++)); do

            ./mihomo convert-ruleset \
              ipcidr \
              text \
              "./ips/${list[i]}/${list[i]}.list" \
              "../mihomo-ruleset/${list[i]}.mrs"

            mv -f \
              "./ips/${list[i]}/${list[i]}.list" \
              ../mihomo-ruleset/

          done


          rm -rf ./mihomo ./domains/ ./ips/


      # ============================================================
      # Download sing-box rule_set files
      # ============================================================

      - name: Download `sing-box` rule_set files
        run: |
          domains=(
            ads
            private
            trackerslist
            microsoft-cn
            apple-cn
            google-cn
            games-cn
            games
            netflix
            disney
            max
            primevideo
            appletv
            youtube
            tiktok
            bilibili
            spotify
            media
            ai
            networktest
            tld-proxy
            gfw
            proxy
            cn
            cn-lite
          )

          ips=(
            privateip
            cnip
            telegramip
            netflixip
            mediaip
          )


          for domain in "${domains[@]}"; do
            mkdir -p "./tools/rules/${domain}/"

            curl -sSL \
              "${domains_download_url}/${domain}.list" \
              > "./tools/rules/${domain}/${domain}.list"
          done


          mkdir -p ./tools/rules/fakeip-filter/

          curl -sSL "${domains_download_url}/fakeip-filter.list" \
            | awk '!/(DOMAIN-REGEX,|ntp|stun|time)/' \
            > ./tmp/temp-fakeip-filter-rules.txt

          cat <<EOF >> ./tmp/temp-fakeip-filter-rules.txt
          DOMAIN-KEYWORD,ntp
          DOMAIN-KEYWORD,stun
          DOMAIN-KEYWORD,time
          EOF

          curl -sSL "${domains_download_url}/fakeip-filter.list" \
            | awk '/DOMAIN-REGEX,/ && !/(ntp|stun|time)/' \
            >> ./tmp/temp-fakeip-filter-rules.txt

          sort --ignore-case \
            ./tmp/temp-fakeip-filter-rules.txt \
            > ./tools/rules/fakeip-filter/fakeip-filter.list


          mkdir -p ./tools/rules/fakeip-filter-lite/

          curl -sSL "${domains_download_url}/fakeip-filter-lite.list" \
            | awk '!/(DOMAIN-REGEX,|ntp|stun|time)/' \
            > ./tmp/temp-fakeip-filter-lite-rules.txt

          cat <<EOF >> ./tmp/temp-fakeip-filter-lite-rules.txt
          DOMAIN-KEYWORD,ntp
          DOMAIN-KEYWORD,stun
          DOMAIN-KEYWORD,time
          EOF

          sort --ignore-case \
            ./tmp/temp-fakeip-filter-lite-rules.txt \
            > ./tools/rules/fakeip-filter-lite/fakeip-filter-lite.list


          rm -rf ./tmp*


          mkdir -p ./tools/rules/applications/

          curl -sSL \
            "${domains_download_url}/applications.list" \
            > ./tools/rules/applications/applications.list


          for ip in "${ips[@]}"; do
            mkdir -p "./tools/rules/${ip}/"

            curl -sSL \
              "${ips_download_url}/${ip}.list" \
              > "./tools/rules/${ip}/${ip}.list"
          done


      # ============================================================
      # Generate sing-box rule_set
      # ============================================================

      - name: Generate `sing-box` rule_set (srs) and move .json files
        run: |

          if [[ "${{ env.singbox_core_latest_version }}" == "${{ env.singbox_core_release_version }}" ]]; then

            echo "singbox_core_old_version=${{ env.singbox_core_compatible_version }}" >> $GITHUB_ENV
            echo "singbox_core_new_version=${{ env.singbox_core_latest_version }}" >> $GITHUB_ENV
            echo "singbox_ruleset_old_version=${{ env.singbox_rules_compatible_version }}" >> $GITHUB_ENV
            echo "singbox_ruleset_new_version=${{ env.singbox_rules_latest_version }}" >> $GITHUB_ENV
            echo "singbox_equal=true" >> $GITHUB_ENV


            curl -sS -L \
              "https://github.com/SagerNet/sing-box/releases/download/v${{ env.singbox_core_compatible_version }}/sing-box-${{ env.singbox_core_compatible_version }}-linux-amd64.tar.gz" \
              | tar -zx -C ./tools/

            mv -f \
              "./tools/sing-box-${{ env.singbox_core_compatible_version }}-linux-amd64/sing-box" \
              ./tools/sing-box


            mkdir -p ./sing-box-ruleset-compatible/

            cd ./tools/

            sed -i \
              's/"version": 1/"version": ${{ env.singbox_ruleset_compatible_version }}/' \
              ./convert.sh

            chmod +x ./convert.sh

            ./convert.sh

            mv -f \
              ./*.json \
              ./*.srs \
              ../sing-box-ruleset-compatible/

            rm -rf ./sing-box*


            cd ../

            curl -sS \
              -o ./tools/sing-box \
              -L https://github.com/a7478729/proxy-tools/releases/download/sing-box/sing-box-ref1nd-stable-linux-amd64-v3.upx

            chmod +x ./tools/sing-box

            mkdir -p ./sing-box-ruleset/

            cd ./tools/

            sed -i \
              's/"version": ${{ env.singbox_ruleset_compatible_version }}/"version": ${{ env.singbox_rules_latest_version }}/' \
              ./convert.sh

            chmod +x ./convert.sh

            ./convert.sh

            mv -f \
              ./*.json \
              ./*.srs \
              ../sing-box-ruleset/

            rm -rf ./sing-box* ./rules*

          else

            echo "singbox_core_old_version=${{ env.singbox_core_compatible_version }}" >> $GITHUB_ENV
            echo "singbox_core_new_version=${{ env.singbox_core_latest_version }}" >> $GITHUB_ENV
            echo "singbox_ruleset_old_version=${{ env.singbox_rules_compatible_version }}" >> $GITHUB_ENV
            echo "singbox_ruleset_new_version=${{ env.singbox_rules_latest_version }}" >> $GITHUB_ENV
            echo "singbox_equal=false" >> $GITHUB_ENV


            curl -sS \
              -o ./tools/sing-box \
              -L https://github.com/a7478729/proxy-tools/releases/download/sing-box/sing-box-ref1nd-stable-linux-amd64-v3.upx

            chmod +x ./tools/sing-box

            mkdir -p ./sing-box-ruleset-compatible/

            cd ./tools/

            sed -i \
              's/"version": 1/"version": ${{ env.singbox_ruleset_compatible_version }}/' \
              ./convert.sh

            chmod +x ./convert.sh

            ./convert.sh

            mv -f \
              ./*.json \
              ./*.srs \
              ../sing-box-ruleset-compatible/

            rm -rf ./sing-box*


            cd ../

            curl -sS \
              -o ./tools/sing-box \
              -L https://github.com/a7478729/proxy-tools/releases/download/sing-box/sing-box-ref1nd-testing-linux-amd64-v3.upx

            chmod +x ./tools/sing-box

            mkdir -p ./sing-box-ruleset/

            cd ./tools/

            sed -i \
              's/"version": ${{ env.singbox_ruleset_compatible_version }}/"version": ${{ env.singbox_rules_latest_version }}/' \
              ./convert.sh

            chmod +x ./convert.sh

            ./convert.sh

            mv -f \
              ./*.json \
              ./*.srs \
              ../sing-box-ruleset/

            rm -rf ./sing-box* ./rules*

          fi


      # ============================================================
      # Download Loon rule-set files
      # ============================================================

      - name: Download `loon` rule-set files
        run: |

          mkdir -p ./tools/loon/domains/
          mkdir -p ./tools/loon/ips/


          # ----------------------------------------------------------
          # Loon domain rule source
          # ----------------------------------------------------------

          loon_domains=(
            ads
            trackerslist
            microsoft-cn
            apple-cn
            google-cn
            games-cn
            games
            netflix
            disney
            max
            primevideo
            appletv
            youtube
            tiktok
            bilibili
            spotify
            media
            ai
            networktest
            tld-proxy
            gfw
            proxy
            cn
            cn-lite
            private
            fakeip-filter
          )


          # ----------------------------------------------------------
          # Loon IP rule source
          # ----------------------------------------------------------

          loon_ips=(
            privateip
            cnip
            telegramip
            netflixip
            mediaip
          )


          # ----------------------------------------------------------
          # Download domain rules
          # ----------------------------------------------------------

          for domain in "${loon_domains[@]}"; do

            curl -sSL \
              "${domains_download_url}/${domain}.list" \
              > "./tools/loon/domains/${domain}.list"

          done


          # ----------------------------------------------------------
          # Download IP rules
          # ----------------------------------------------------------

          for ip in "${loon_ips[@]}"; do

            curl -sSL \
              "${ips_download_url}/${ip}.list" \
              > "./tools/loon/ips/${ip}.list"

          done


      # ============================================================
      # Generate Loon rule-set (mrs) and move .list files
      #
      # 注意：
      # 这里虽然保持与 Mihomo 流程命名结构一致，
      # 但实际输出严格使用 Loon 规则格式。
      #
      # 不添加 ,Proxy
      # ============================================================

      - name: Generate `loon` rule-set (mrs) and move .list files
        run: |

          mkdir -p ./loon_ruleset/


          # ----------------------------------------------------------
          # Domain rules
          #
          # 保留原始 Loon 规则类型：
          #
          # DOMAIN,
          # DOMAIN-SUFFIX,
          # DOMAIN-KEYWORD,
          # DOMAIN-REGEX,
          #
          # 不增加 ,Proxy
          # ----------------------------------------------------------

          for file in ./tools/loon/domains/*.list; do

            [ -f "$file" ] || continue

            name=$(basename "$file" .list)

            awk '
              /^[[:space:]]*$/ {
                next
              }

              /^DOMAIN,/ {
                print
                next
              }

              /^DOMAIN-SUFFIX,/ {
                print
                next
              }

              /^DOMAIN-KEYWORD,/ {
                print
                next
              }

              /^DOMAIN-REGEX,/ {
                print
                next
              }
            ' "$file" \
              | sed '/^[[:space:]]*$/d' \
              | sort -u \
              > "./loon_ruleset/${name}.list"

          done


          # ----------------------------------------------------------
          # IP rules
          #
          # 兼容：
          #
          # IP-CIDR,
          # IP-CIDR6,
          #
          # 以及原始 CIDR 数据。
          #
          # 不添加 ,Proxy
          # ----------------------------------------------------------

          for file in ./tools/loon/ips/*.list; do

            [ -f "$file" ] || continue

            name=$(basename "$file" .list)

            awk '
              /^[[:space:]]*$/ {
                next
              }

              /^IP-CIDR,/ {
                print
                next
              }

              /^IP-CIDR6,/ {
                print
                next
              }

              /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\/[0-9]+$/ {
                print "IP-CIDR," $0
                next
              }

              /^[0-9A-Fa-f:]+\/[0-9]+$/ {
                print "IP-CIDR6," $0
                next
              }
            ' "$file" \
              | sort -u \
              > "./loon_ruleset/${name}.list"

          done


          # ----------------------------------------------------------
          # 删除空文件
          # ----------------------------------------------------------

          find ./loon_ruleset \
            -type f \
            -empty \
            -delete


          # ----------------------------------------------------------
          # 最终去重
          # ----------------------------------------------------------

          for file in ./loon_ruleset/*.list; do

            [ -f "$file" ] || continue

            sort -u \
              "$file" \
              -o "$file"

          done


          # ----------------------------------------------------------
          # 清理 Loon 临时目录
          # ----------------------------------------------------------

          rm -rf ./tools/loon/


      # ============================================================
      # Release mihomo-geodata
      # ============================================================

      - name: Release and upload `mihomo-geodata` assets
        uses: svenstaro/upload-release-action@v2
