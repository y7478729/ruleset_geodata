name: Build ruleset and geodata

on:
  workflow_dispatch:

  schedule:
  - cron: "0 19 * * *"

  push:
    branches:
    - main
    paths-ignore:
    - "**/README.md"
    - "**/*.ini"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # ==========================================================
    # Variables
    # ==========================================================

    - name: Set variables
      shell: bash
      run: |
        set -euo pipefail

        echo "update_version=$(date -d '+8 hours' +%Y-%m-%d)" >> "${GITHUB_ENV}"

        echo "singbox_core_release_version=$(curl -fsSL 'https://api.github.com/repos/reF1nd/sing-box/tags?per_page=100' \
          | jq -r '.[].name' \
          | grep -P '^v?[0-9]+\.[0-9]+\.[0-9]+-reF1nd.*' \
          | head -n 1 \
          | awk -F'[v.-]' '{print $2"."$3".0"}')" >> "${GITHUB_ENV}"

        echo "singbox_core_latest_version=$(curl -fsSL \
          'https://raw.githubusercontent.com/reF1nd/sing-box/reF1nd-testing/docs/configuration/rule-set/source-format.md' \
          | awk '/\*/ {last=$0} END {print last}' \
          | sed -n 's/.*\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p')" >> "${GITHUB_ENV}"

        echo "singbox_core_compatible_version=$(curl -fsSL \
          'https://raw.githubusercontent.com/reF1nd/sing-box/reF1nd-testing/docs/configuration/rule-set/source-format.md' \
          | awk '/\*/ {lines[++count]=$0} END {print lines[count-1]}' \
          | sed -n 's/.*\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p')" >> "${GITHUB_ENV}"

        echo "singbox_rules_latest_version=$(curl -fsSL \
          'https://raw.githubusercontent.com/reF1nd/sing-box/reF1nd-testing/docs/configuration/rule-set/source-format.md' \
          | awk '/\*/ {last=$0} END {print last}' \
          | sed -n 's/^* \([0-9]\+\):.*/\1/p')" >> "${GITHUB_ENV}"

        echo "singbox_rules_compatible_version=$(curl -fsSL \
          'https://raw.githubusercontent.com/reF1nd/sing-box/reF1nd-testing/docs/configuration/rule-set/source-format.md' \
          | awk '/\*/ {lines[++count]=$0} END {print lines[count-1]}' \
          | sed -n 's/^* \([0-9]\+\):.*/\1/p')" >> "${GITHUB_ENV}"

        echo "domains_download_url=https://github.com/y7478729/domain-list-custom/releases/download/domains" >> "${GITHUB_ENV}"

        echo "ips_download_url=https://github.com/y7478729/geoip/releases/download/ips" >> "${GITHUB_ENV}"

    # ==========================================================
    # Checkout
    # ==========================================================

    - name: Clone Repository
      uses: actions/checkout@v7

    - name: Checkout `y7478729/domain-list-custom`
      uses: actions/checkout@v7
      with:
        repository: y7478729/domain-list-custom
        path: custom

    - name: Checkout `v2fly/domain-list-community`
      uses: actions/checkout@v7
      with:
        repository: v2fly/domain-list-community
        path: community

    # ==========================================================
    # Go
    # ==========================================================

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: ./custom/go.mod
        cache-dependency-path: ./custom/go.sum

    # ==========================================================
    # Generate mihomo geodata
    # ==========================================================

    - name: Generate `mihomo` geodata
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p ./tmp/
        mkdir -p ./community/mydata/

        archs1=(
          ads
          private
          trackerslist
          microsoft-cn
          apple-cn
          google-cn
          games-cn
          games
          netflix
          disney
          max
          primevideo
          appletv
          youtube
          tiktok
          bilibili
          spotify
          media
          ai
          networktest
          tld-proxy
          gfw
          proxy
          cn
        )

        archs2=(
          ads
          private
          microsoft-cn
          apple-cn
          google-cn
          games-cn
          games
          ai
          networktest
          tld-proxy
          gfw
          proxy
          cn
        )

        archs3=(
          private
          microsoft-cn
          apple-cn
          google-cn
          games-cn
          gfw
          cn-lite
        )

        # --------------------------------------------------------
        # fakeip-filter
        # --------------------------------------------------------

        curl -fsSL \
          "${domains_download_url}/fakeip-filter.list" \
          | awk '!/(DOMAIN-REGEX,|ntp|stun|time)/' \
          | sed \
            -e 's/DOMAIN,/full:/' \
            -e 's/DOMAIN-SUFFIX,//' \
          > ./tmp/temp-fakeip-filter.txt

        cat <<EOF >> ./tmp/temp-fakeip-filter.txt
        keyword:ntp
        keyword:stun
        keyword:time
        EOF

        curl -fsSL \
          "${domains_download_url}/fakeip-filter.list" \
          | awk '/DOMAIN-REGEX,/ && !/(ntp|stun|time)/' \
          | sed 's/DOMAIN-REGEX,/regexp:/' \
          >> ./tmp/temp-fakeip-filter.txt

        sort --ignore-case \
          ./tmp/temp-fakeip-filter.txt \
          > ./tmp/fakeip-filter.txt

        # --------------------------------------------------------
        # fakeip-filter-lite
        # --------------------------------------------------------

        curl -fsSL \
          "${domains_download_url}/fakeip-filter-lite.list" \
          | awk '!/(DOMAIN-REGEX,|ntp|stun|time)/' \
          | sed \
            -e 's/DOMAIN,/full:/' \
            -e 's/DOMAIN-SUFFIX,//' \
          > ./tmp/temp-fakeip-filter-lite.txt

        cat <<EOF >> ./tmp/temp-fakeip-filter-lite.txt
        keyword:ntp
        keyword:stun
        keyword:time
        EOF

        sort --ignore-case \
          ./tmp/temp-fakeip-filter-lite.txt \
          > ./tmp/fakeip-filter-lite.txt

        # --------------------------------------------------------
        # geosite-all.dat
        # --------------------------------------------------------

        cd ./community/

        for arch1 in "${archs1[@]}"; do
          curl -fsSL \
            "${domains_download_url}/${arch1}.list" \
            | sed \
              -e 's/DOMAIN,/full:/' \
              -e 's/DOMAIN-SUFFIX,//' \
              -e 's/DOMAIN-KEYWORD,/keyword:/' \
              -e 's/DOMAIN-REGEX,/regexp:/' \
            > "./mydata/${arch1}"
        done

        cp -f ../tmp/fakeip-filter.txt \
          ./mydata/fakeip-filter

        go run ./ \
          --datapath=./mydata/ \
          --outputname geosite-all.dat

        # --------------------------------------------------------
        # geosite-all-lite.dat
        # --------------------------------------------------------

        rm -f ./mydata/ads

        cp -f ../tmp/fakeip-filter-lite.txt \
          ./mydata/fakeip-filter

        go run ./ \
          --datapath=./mydata/ \
          --outputname geosite-all-lite.dat

        # --------------------------------------------------------
        # geosite.dat
        # --------------------------------------------------------

        rm -f ./mydata/*

        for arch2 in "${archs2[@]}"; do
          curl -fsSL \
            "${domains_download_url}/${arch2}.list" \
            | sed \
              -e 's/DOMAIN,/full:/' \
              -e 's/DOMAIN-SUFFIX,//' \
              -e 's/DOMAIN-KEYWORD,/keyword:/' \
              -e 's/DOMAIN-REGEX,/regexp:/' \
            > "./mydata/${arch2}"
        done

        cp -f ../tmp/fakeip-filter.txt \
          ./mydata/fakeip-filter

        go run ./ \
          --datapath=./mydata/ \
          --outputname geosite.dat

        # --------------------------------------------------------
        # geosite-lite.dat
        # --------------------------------------------------------

        rm -f ./mydata/ads

        cp -f ../tmp/fakeip-filter-lite.txt \
          ./mydata/fakeip-filter

        go run ./ \
          --datapath=./mydata/ \
          --outputname geosite-lite.dat

        # --------------------------------------------------------
        # geosite-mini.dat
        # --------------------------------------------------------

        rm -f ./mydata/*

        for arch3 in "${archs3[@]}"; do
          curl -fsSL \
            "${domains_download_url}/${arch3}.list" \
            | sed \
              -e 's/DOMAIN,/full:/' \
              -e 's/DOMAIN-SUFFIX,//' \
              -e 's/DOMAIN-KEYWORD,/keyword:/' \
              -e 's/DOMAIN-REGEX,/regexp:/' \
            > "./mydata/${arch3}"
        done

        mv -f ./mydata/cn-lite \
          ./mydata/cn

        go run ./ \
          --datapath=./mydata/ \
          --outputname geosite-mini.dat

    # ==========================================================
    # Get geoip relative files
    # ==========================================================

    - name: Get geoip relative files
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p ./mihomo-geodata/

        mapfile -t mihomo_mmdb < <(
          curl -fsSL \
            https://api.github.com/repos/y7478729/geoip/releases \
            | awk '/"browser_download_url"/' \
            | awk '/\.mmdb/' \
            | awk -F '"' '{print $4}'
        )

        for url in "${mihomo_mmdb[@]}"; do
          wget -q \
            -P ./mihomo-geodata/ \
            "${url}"
        done

        mapfile -t mihomo_others < <(
          curl -fsSL \
            https://api.github.com/repos/y7478729/geoip/releases \
            | awk '/"browser_download_url"/' \
            | awk '/\/mihomo-geodata\//' \
            | awk '!/\.mmdb/' \
            | awk -F '"' '{print $4}'
        )

        for url in "${mihomo_others[@]}"; do
          wget -q \
            -P ./community/ \
            "${url}"
        done

    # ==========================================================
    # Move mihomo geodata
    # ==========================================================

    - name: Move `mihomo` geodata files
      shell: bash
      run: |
        set -euo pipefail

        cd ./community/

        shopt -s nullglob

        for file in *.dat *.metadb; do
          install -Dp \
            "./${file}" \
            ../mihomo-geodata/
        done

        cd ..

        rm -rf ./custom
        rm -rf ./community

    # ==========================================================
    # Download mihomo rule-set
    # ==========================================================

    - name: Download `mihomo` rule-set files
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p ./mihomo-ruleset/
        mkdir -p ./tools/
        mkdir -p ./tmp/

        domains=(
          ads
          trackerslist
          microsoft-cn
          apple-cn
          google-cn
          games-cn
          games
          netflix
          disney
          max
          primevideo
          appletv
          youtube
          tiktok
          bilibili
          spotify
          media
          ai
          networktest
          tld-proxy
          gfw
          proxy
          cn
          cn-lite
        )

        ips=(
          privateip
          cnip
          telegramip
          netflixip
          mediaip
        )

        # --------------------------------------------------------
        # Domain rules
        # --------------------------------------------------------

        for domain in "${domains[@]}"; do
          mkdir -p "./tools/domains/${domain}/"

          curl -fsSL \
            "${domains_download_url}/${domain}.list" \
            | awk '/(DOMAIN,|DOMAIN-SUFFIX,)/' \
            | sed \
              -e 's/DOMAIN,//' \
              -e 's/DOMAIN-SUFFIX,/\+\./' \
            > "./tools/domains/${domain}/${domain}.list"
        done

        # --------------------------------------------------------
        # fakeip-filter
        # --------------------------------------------------------

        mkdir -p ./tools/domains/fakeip-filter/

        curl -fsSL \
          "${domains_download_url}/fakeip-filter.list" \
          | awk '!/DOMAIN-REGEX,/' \
          | sed \
            -e 's/DOMAIN,//' \
            -e 's/DOMAIN-SUFFIX,/\+\./' \
          > ./tmp/temp-fakeip-filter-domains.txt

        curl -fsSL \
          "${domains_download_url}/fakeip-filter.list" \
          | awk '/DOMAIN-REGEX,/' \
          | sed \
            -e 's/\\s/ /' \
            -e 's/\\./\./g' \
            -e 's/\[\^.\]+/*/g' \
            -e 's/\^\.\*/\^\+/' \
            -e 's/.*\^//; s/\$//' \
          >> ./tmp/temp-fakeip-filter-domains.txt

        sort --ignore-case \
          ./tmp/temp-fakeip-filter-domains.txt \
          > ./tools/domains/fakeip-filter/fakeip-filter.list

        # --------------------------------------------------------
        # fakeip-filter-lite
        # --------------------------------------------------------

        mkdir -p ./tools/domains/fakeip-filter-lite/

        curl -fsSL \
          "${domains_download_url}/fakeip-filter-lite.list" \
          | awk '!/DOMAIN-REGEX,/' \
          | sed \
            -e 's/DOMAIN,//' \
            -e 's/DOMAIN-SUFFIX,/\+\./' \
          > ./tmp/temp-fakeip-filter-lite-domains.txt

        curl -fsSL \
          "${domains_download_url}/fakeip-filter-lite.list" \
          | awk '/DOMAIN-REGEX,/' \
          | sed \
            -e 's/\\./\./g' \
            -e 's/\[\^.\]+/*/g' \
            -e 's/\^\.\*/\^\+/' \
            -e 's/.*\^//; s/\$//' \
          >> ./tmp/temp-fakeip-filter-lite-domains.txt

        sort --ignore-case \
          ./tmp/temp-fakeip-filter-lite-domains.txt \
          > ./tools/domains/fakeip-filter-lite/fakeip-filter-lite.list

        # --------------------------------------------------------
        # private
        # --------------------------------------------------------

        mkdir -p ./tools/domains/private/

        curl -fsSL \
          "${domains_download_url}/private.list" \
          | awk '/(DOMAIN,|DOMAIN-SUFFIX,)/' \
          | sed \
            -e 's/DOMAIN,//' \
            -e 's/DOMAIN-SUFFIX,/\+\./' \
          > ./tmp/temp-private-domains.txt

        curl -fsSL \
          "${domains_download_url}/private.list" \
          | awk '/DOMAIN-REGEX,/' \
          | sed \
            -e 's/\\./\./g' \
            -e 's/\[\^.\]+/*/g' \
            -e 's/\^\.\*/\^\+/' \
            -e 's/.*\^//; s/\$//' \
          >> ./tmp/temp-private-domains.txt

        sort --ignore-case \
          ./tmp/temp-private-domains.txt \
          > ./tools/domains/private/private.list

        rm -f ./tmp/*

        # --------------------------------------------------------
        # applications
        # --------------------------------------------------------

        curl -fsSL \
          "${domains_download_url}/applications.list" \
          > ./mihomo-ruleset/applications.list

        # --------------------------------------------------------
        # IP rules
        # --------------------------------------------------------

        for ip in "${ips[@]}"; do
          mkdir -p "./tools/ips/${ip}/"

          curl -fsSL \
            "${ips_download_url}/${ip}.list" \
            | sed 's/.*,//' \
            > "./tools/ips/${ip}/${ip}.list"
        done

    # ==========================================================
    # Generate mihomo MRS
    # ==========================================================

    - name: Generate `mihomo` rule-set (mrs) and move .list files
      shell: bash
      run: |
        set -euo pipefail

        curl -fsSL \
          -o ./tools/mihomo \
          -L \
          https://github.com/y7478729/proxy-tools/releases/download/mihomo/mihomo-meta-linux-amd64-v3.upx

        chmod +x ./tools/mihomo

        cd ./tools/

        domains_list=()
        shopt -s nullglob

        for dir in ./domains/*/; do
          domains_list+=("${dir%/}")
        done

        for domain_path in "${domains_list[@]}"; do
          domain="${domain_path#./domains/}"

          ./mihomo convert-ruleset \
            domain \
            text \
            "./domains/${domain}/${domain}.list" \
            "../../mihomo-ruleset/${domain}.mrs"

          mv -f \
            "./domains/${domain}/${domain}.list" \
            ../../mihomo-ruleset/
        done

        ips_list=()

        for dir in ./ips/*/; do
          ips_list+=("${dir%/}")
        done

        for ip_path in "${ips_list[@]}"; do
          ip="${ip_path#./ips/}"

          ./mihomo convert-ruleset \
            ipcidr \
            text \
            "./ips/${ip}/${ip}.list" \
            "../../mihomo-ruleset/${ip}.mrs"

          mv -f \
            "./ips/${ip}/${ip}.list" \
            ../../mihomo-ruleset/
        done

        rm -rf ./mihomo
        rm -rf ./domains/
        rm -rf ./ips/

    # ==========================================================
    # Download sing-box rule_set source
    # ==========================================================

    - name: Download `sing-box` rule_set files
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p ./tools/rules/
        mkdir -p ./tmp/

        domains=(
          ads
          private
          trackerslist
          microsoft-cn
          apple-cn
          google-cn
          games-cn
          games
          netflix
          disney
          max
          primevideo
          appletv
          youtube
          tiktok
          bilibili
          spotify
          media
          ai
          networktest
          tld-proxy
          gfw
          proxy
          cn
          cn-lite
        )

        ips=(
          privateip
          cnip
          telegramip
          netflixip
          mediaip
        )

        # --------------------------------------------------------
        # Domain rules
        # --------------------------------------------------------

        for domain in "${domains[@]}"; do
          mkdir -p "./tools/rules/${domain}/"

          curl -fsSL \
            "${domains_download_url}/${domain}.list" \
            | awk '
              /^DOMAIN,/ {
                print "{\"domain\":[\""substr($0,8)"\"]}"
              }

              /^DOMAIN-SUFFIX,/ {
                print "{\"domain_suffix\":[\""substr($0,15)"\"]}"
              }

              /^DOMAIN-KEYWORD,/ {
                print "{\"domain_keyword\":[\""substr($0,16)"\"]}"
              }

              /^DOMAIN-REGEX,/ {
                print "{\"domain_regex\":[\""substr($0,14)"\"]}"
              }
            ' \
            > "./tools/rules/${domain}/${domain}.json"
        done

        # --------------------------------------------------------
        # fakeip-filter
        # --------------------------------------------------------

        mkdir -p ./tools/rules/fakeip-filter/

        curl -fsSL \
          "${domains_download_url}/fakeip-filter.list" \
          | awk '!/(DOMAIN-REGEX,|ntp|stun|time)/' \
          > ./tmp/temp-fakeip-filter-rules.txt

        cat <<EOF >> ./tmp/temp-fakeip-filter-rules.txt
        DOMAIN-KEYWORD,ntp
        DOMAIN-KEYWORD,stun
        DOMAIN-KEYWORD,time
        EOF

        curl -fsSL \
          "${domains_download_url}/fakeip-filter.list" \
          | awk '/DOMAIN-REGEX,/ && !/(ntp|stun|time)/' \
          >> ./tmp/temp-fakeip-filter-rules.txt

        sort --ignore-case \
          ./tmp/temp-fakeip-filter-rules.txt \
          > ./tools/rules/fakeip-filter/fakeip-filter.list

        # --------------------------------------------------------
        # fakeip-filter-lite
        # --------------------------------------------------------

        mkdir -p ./tools/rules/fakeip-filter-lite/

        curl -fsSL \
          "${domains_download_url}/fakeip-filter-lite.list" \
          | awk '!/(DOMAIN-REGEX,|ntp|stun|time)/' \
          > ./tmp/temp-fakeip-filter-lite-rules.txt

        cat <<EOF >> ./tmp/temp-fakeip-filter-lite-rules.txt
        DOMAIN-KEYWORD,ntp
        DOMAIN-KEYWORD,stun
        DOMAIN-KEYWORD,time
        EOF

        sort --ignore-case \
          ./tmp/temp-fakeip-filter-lite-rules.txt \
          > ./tools/rules/fakeip-filter-lite/fakeip-filter-lite.list

        rm -rf ./tmp/*

        # --------------------------------------------------------
        # applications
        # --------------------------------------------------------

        mkdir -p ./tools/rules/applications/

        curl -fsSL \
          "${domains_download_url}/applications.list" \
          > ./tools/rules/applications/applications.list

        # --------------------------------------------------------
        # IP rules
        # --------------------------------------------------------

        for ip in "${ips[@]}"; do
          mkdir -p "./tools/rules/${ip}/"

          curl -fsSL \
            "${ips_download_url}/${ip}.list" \
            > "./tools/rules/${ip}/${ip}.list"
        done

    # ==========================================================
    # Generate sing-box SRS
    # ==========================================================

    - name: Generate `sing-box` rule_set (srs) and move .json files
      shell: bash
      run: |
        set -euo pipefail

        # --------------------------------------------------------
        # Determine sing-box version compatibility
        # --------------------------------------------------------

        if [[ "${singbox_core_latest_version}" == "${singbox_core_release_version}" ]]; then

          echo "singbox_core_old_version=${singbox_core_compatible_version}" >> "${GITHUB_ENV}"
          echo "singbox_core_new_version=${singbox_core_latest_version}" >> "${GITHUB_ENV}"

          echo "singbox_ruleset_old_version=${singbox_rules_compatible_version}" >> "${GITHUB_ENV}"
          echo "singbox_ruleset_new_version=${singbox_rules_latest_version}" >> "${GITHUB_ENV}"

          echo "singbox_equal=true" >> "${GITHUB_ENV}"

          # ------------------------------------------------------
          # Compatible rule_set
          # ------------------------------------------------------

          curl -fsSL \
            "https://github.com/SagerNet/sing-box/releases/download/v${singbox_core_compatible_version}/sing-box-${singbox_core_compatible_version}-linux-amd64.tar.gz" \
            | tar -zx -C ./tools/

          mv -f \
            "./tools/sing-box-${singbox_core_compatible_version}-linux-amd64/sing-box" \
            ./tools/sing-box

          mkdir -p ./sing-box-ruleset-compatible/

          cd ./tools/

          sed -i \
            "s/\"version\": 1/\"version\": ${singbox_rules_compatible_version}/" \
            ./convert.sh

          chmod +x ./convert.sh

          ./convert.sh

          mv -f \
            ./*.json \
            ./*.srs \
            ../sing-box-ruleset-compatible/

          rm -rf ./sing-box*

          # ------------------------------------------------------
          # Latest rule_set
          # ------------------------------------------------------

          cd ../

          curl -fsSL \
            -o ./tools/sing-box \
            https://github.com/y7478729/proxy-tools/releases/download/sing-box/sing-box-ref1nd-stable-linux-amd64-v3.upx

          chmod +x ./tools/sing-box

          mkdir -p ./sing-box-ruleset/

          cd ./tools/

          sed -i \
            "s/\"version\": ${singbox_rules_compatible_version}/\"version\": ${singbox_rules_latest_version}/" \
            ./convert.sh

          chmod +x ./convert.sh

          ./convert.sh

          mv -f \
            ./*.json \
            ./*.srs \
            ../sing-box-ruleset/

          rm -rf ./sing-box*
          rm -rf ./rules*

        else

          echo "singbox_core_old_version=${singbox_core_compatible_version}" >> "${GITHUB_ENV}"
          echo "singbox_core_new_version=${singbox_core_latest_version}" >> "${GITHUB_ENV}"

          echo "singbox_ruleset_old_version=${singbox_rules_compatible_version}" >> "${GITHUB_ENV}"
          echo "singbox_ruleset_new_version=${singbox_rules_latest_version}" >> "${GITHUB_ENV}"

          echo "singbox_equal=false" >> "${GITHUB_ENV}"

          # ------------------------------------------------------
          # Compatible rule_set
          # ------------------------------------------------------

          curl -fsSL \
            -o ./tools/sing-box \
            https://github.com/y7478729/proxy-tools/releases/download/sing-box/sing-box-ref1nd-stable-linux-amd64-v3.upx

          chmod +x ./tools/sing-box

          mkdir -p ./sing-box-ruleset-compatible/

          cd ./tools/

          sed -i \
            "s/\"version\": 1/\"version\": ${singbox_rules_compatible_version}/" \
            ./convert.sh

          chmod +x ./convert.sh

          ./convert.sh

          mv -f \
            ./*.json \
            ./*.srs \
            ../sing-box-ruleset-compatible/

          rm -rf ./sing-box*

          # ------------------------------------------------------
          # Latest rule_set
          # ------------------------------------------------------

          cd ../

          curl -fsSL \
            -o ./tools/sing-box \
            https://github.com/y7478729/proxy-tools/releases/download/sing-box/sing-box-ref1nd-testing-linux-amd64-v3.upx

          chmod +x ./tools/sing-box

          mkdir -p ./sing-box-ruleset/

          cd ./tools/

          sed -i \
            "s/\"version\": ${singbox_rules_compatible_version}/\"version\": ${singbox_rules_latest_version}/" \
            ./convert.sh

          chmod +x ./convert.sh

          ./convert.sh

          mv -f \
            ./*.json \
            ./*.srs \
            ../sing-box-ruleset/

          rm -rf ./sing-box*
          rm -rf ./rules*

        fi

    # ==========================================================
    # Download Loon rule-set source
    # ==========================================================

    - name: Download `loon` rule-set files
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p ./tools/loon/domains/
        mkdir -p ./tools/loon/ips/

        # --------------------------------------------------------
        # Loon domain rule source
        # --------------------------------------------------------

        loon_domains=(
          ads
          trackerslist
          microsoft-cn
          apple-cn
          google-cn
          games-cn
          games
          netflix
          disney
          max
          primevideo
          appletv
          youtube
          tiktok
          bilibili
          spotify
          media
          ai
          networktest
          tld-proxy
          gfw
          proxy
          cn
          cn-lite
          private
          fakeip-filter
        )

        # --------------------------------------------------------
        # Loon IP rule source
        # --------------------------------------------------------

        loon_ips=(
          privateip
          cnip
          telegramip
          netflixip
          mediaip
        )

        # --------------------------------------------------------
        # Download domain rules
        # --------------------------------------------------------

        for domain in "${loon_domains[@]}"; do
          curl -fsSL \
            "${domains_download_url}/${domain}.list" \
            > "./tools/loon/domains/${domain}.list"
        done

        # --------------------------------------------------------
        # Download IP rules
        # --------------------------------------------------------

        for ip in "${loon_ips[@]}"; do
          curl -fsSL \
            "${ips_download_url}/${ip}.list" \
            > "./tools/loon/ips/${ip}.list"
        done

    # ==========================================================
    # Generate Loon rule-set
    # ==========================================================

    - name: Generate `loon` rule-set and move .list files
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p ./loon_ruleset/

        # --------------------------------------------------------
        # Domain rules
        # --------------------------------------------------------

        shopt -s nullglob

        for file in ./tools/loon/domains/*.list; do

          name=$(basename "${file}" .list)

          awk '
            /^[[:space:]]*$/ {
              next
            }

            /^DOMAIN,/ {
              print
              next
            }

            /^DOMAIN-SUFFIX,/ {
              print
              next
            }

            /^DOMAIN-KEYWORD,/ {
              print
              next
            }

            /^DOMAIN-REGEX,/ {
              print
              next
            }
          ' "${file}" \
            | sed '/^[[:space:]]*$/d' \
            | sort -u \
            > "./loon_ruleset/${name}.list"

        done

        # --------------------------------------------------------
        # IP rules
        # --------------------------------------------------------

        for file in ./tools/loon/ips/*.list; do

          name=$(basename "${file}" .list)

          awk '
            /^[[:space:]]*$/ {
              next
            }

            /^IP-CIDR,/ {
              print
              next
            }

            /^IP-CIDR6,/ {
              print
              next
            }

            /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\/[0-9]+$/ {
              print "IP-CIDR," $0
              next
            }

            /^[0-9A-Fa-f:]+\/[0-9]+$/ {
              print "IP-CIDR6," $0
              next
            }
          ' "${file}" \
            | sort -u \
            > "./loon_ruleset/${name}.list"

        done

        # --------------------------------------------------------
        # Delete empty files
        # --------------------------------------------------------

        find ./loon_ruleset \
          -type f \
          -empty \
          -delete

        # --------------------------------------------------------
        # Final deduplication
        # --------------------------------------------------------

        for file in ./loon_ruleset/*.list; do

          [ -f "${file}" ] || continue

          sort -u \
            "${file}" \
            -o "${file}"

        done

        # --------------------------------------------------------
        # Cleanup
        # --------------------------------------------------------

        rm -rf ./tools/loon/

